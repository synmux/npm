version: 0.1
cli:
  version: 1.25.0
plugins:
  sources:
    - id: trunk
      ref: v1.11.0
      uri: https://github.com/trunk-io/plugins
runtimes:
  enabled:
    - go@1.21.0
    - node@22.16.0
    - python@3.14.4
actions:
  enabled:
    - trunk-announce
    - trunk-check-pre-push
    - trunk-fmt-pre-commit
    - trunk-upgrade-available
lint:
  disabled:
    - trivy
    - sort-package-json
    - renovate
    - cspell
    - eslint
    - prettier
  enabled:
    - grype@0.118.0
    - pinact@4.1.1
    - actionlint@1.7.12
    - biome@2.5.11
    - checkov@3.3.16
    - circleci@1.0.49173
    - djlint@1.44.2
    - dotenv-linter@4.0.0
    - dustilock@1.2.0
    - git-diff-check
    - gitleaks@8.30.1
    - hadolint@2.15.1
    - kube-linter@0.7.2
    - markdown-link-check@3.15.0
    - markdownlint-cli2@0.23.2
    - markdownlint@0.49.1
    - nancy@2.1.0
    - osv-scanner@2.5.1
    - oxipng@10.2.0
    - pre-commit-hooks@5.0.0
    - semgrep@1.175.0
    - shellcheck@0.11.0
    - shfmt@3.14.0
    - stylelint@17.14.1
    - svgo@4.1.0
    - taplo@0.10.0
    - trufflehog-git@3.97.1
    - trufflehog@3.97.1
    - yamllint@1.38.0
merge:
  required_statuses:
    - CodeQL
    - devskim
    - codacy
